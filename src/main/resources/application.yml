spring:
  application:
    name: CellServiceLoad
server:
  port: 8085

cell-service:
  http-url: http://localhost:8080
  ws-url: ws://localhost:8080/ws

# The defaults on the page at :8085; a run can change them while it goes.
load:
  # start a run with these right away, for running without the page
  autostart: false
  max-clients: 2000
  ramp-up-per-second: 2
  # stop after this many minutes; 0 runs until stopped
  duration-minutes: 0
  phone-share: 0.7
  zoomed-out-share: 0.15
  # the frontend reconnects after this long without a message from the server
  reconnect-threshold-ms: 4000
