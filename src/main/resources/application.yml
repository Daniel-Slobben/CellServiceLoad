spring:
  application:
    name: CellServiceLoad
server:
  port: 8085

cell-service:
  http-url: http://localhost:8080
  ws-url: ws://localhost:8080/ws

load:
  max-clients: 3000
  phone-share: 0.7
  zoomed-out-share: 0.15
  # the frontend reconnects after this long without a message from the server
  reconnect-threshold-ms: 1500
